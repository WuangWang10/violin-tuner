<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101522">
<meta name="description" content="五线谱识谱练习：单音符/短旋律双模式，三档难度，随机不重复题库。">
<title>识谱练习 · Note Reading</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎼</text></svg>">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/notes.css">
</head>
<body data-page="notes">

<header class="app-header">
  <div class="brand">🎼 识谱练习</div>
  <div class="brand-sub">Note Reading Trainer</div>
</header>

<nav class="site-nav">
  <a class="nav-link" href="index.html">🎻 调音器</a>
  <a class="nav-link active" href="notes.html">🎼 识谱</a>
  <a class="nav-link" href="rhythm.html">🥁 节奏</a>
  <a class="nav-link" href="ear.html">🎧 音准</a>
</nav>

<main class="app">

  <!-- 练习设置 -->
  <section class="card" id="setupCard">
    <h2>练习设置</h2>
    <div class="set-label">出题形式</div>
    <div class="btn-grid" id="modeRow">
      <button class="choice-btn active" data-mode="single">单音符</button>
      <button class="choice-btn" data-mode="melody">短旋律</button>
    </div>
    <div class="set-label">难度（高音谱号 · 音符数与音域递进）</div>
    <div class="btn-grid" id="levelRow">
      <button class="choice-btn active" data-level="1">初级<br><small>C4–B4</small></button>
      <button class="choice-btn" data-level="2">中级<br><small>C4–F5 含升号</small></button>
      <button class="choice-btn" data-level="3">高级<br><small>G3–C6 全升号</small></button>
    </div>
    <div class="set-tip">每轮 20 题，随机抽题不重复、无固定规律；答完可重新洗牌再来一轮。</div>
    <button id="startBtn" class="btn btn-primary">▶ 开始练习</button>
  </section>

  <!-- 答题区 -->
  <section class="card hidden" id="quizCard">
    <div class="quiz-top">
      <span id="progressText">第 1 / 20 题</span>
      <span id="scoreText">对 0 · 错 0</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

    <div class="staff-wrap">
      <svg id="staff" viewBox="0 0 540 180" role="img" aria-label="五线谱"></svg>
    </div>

    <div class="set-label">这个音是什么？</div>
    <div class="answer-row" id="answerRow"></div>

    <div class="feedback" id="feedback">&nbsp;</div>
  </section>

  <!-- 结果 -->
  <section class="card hidden" id="resultCard">
    <h2>本轮完成 🎉</h2>
    <div class="stats">
      <div class="stat"><div class="stat-num" id="resRate">—</div><div class="stat-label">正确率</div></div>
      <div class="stat"><div class="stat-num" id="resRight">0</div><div class="stat-label">答对</div></div>
      <div class="stat"><div class="stat-num" id="resWrong">0</div><div class="stat-label">答错</div></div>
      <div class="stat"><div class="stat-num" id="resStreak">0</div><div class="stat-label">最长连对</div></div>
    </div>
    <div class="btn-row">
      <button id="againBtn" class="btn btn-primary">🔀 再来一轮（重新洗牌）</button>
      <button id="backBtn" class="btn btn-ghost">⚙ 返回设置</button>
    </div>
  </section>

</main>

<footer class="app-footer">
  识谱练习 · 高音谱号 · 随机题库 · 同站可切「调音器」「节奏」
</footer>

<script src="js/pitch.js"></script>
<script src="js/notation.js"></script>
<script src="js/notes.js"></script>
</body>
</html>
