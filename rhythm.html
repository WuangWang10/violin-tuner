<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101522">
<meta name="description" content="节奏练习：按五线谱音符敲击，可调 BPM，内置节拍器，实时判定准确度。">
<title>节奏练习 · Rhythm Trainer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥁</text></svg>">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/rhythm.css">
</head>
<body data-page="rhythm">

<header class="app-header">
  <div class="brand">🥁 节奏练习</div>
  <div class="brand-sub">Rhythm Trainer</div>
</header>

<nav class="site-nav">
  <a class="nav-link" href="index.html">🎻 调音器</a>
  <a class="nav-link" href="notes.html">🎼 识谱</a>
  <a class="nav-link active" href="rhythm.html">🥁 节奏</a>
  <a class="nav-link" href="ear.html">🎧 音准</a>
</nav>

<main class="app">

  <!-- 设置 -->
  <section class="card" id="setupCard">
    <h2>练习设置</h2>
    <div class="set-label">关卡（节奏型由易到难）</div>
    <div class="level-grid" id="levelRow">
      <button class="rh-level active" data-level="0">1<br><small>四分</small></button>
      <button class="rh-level" data-level="1">2<br><small>二分</small></button>
      <button class="rh-level" data-level="2">3<br><small>八分</small></button>
      <button class="rh-level" data-level="3">4<br><small>附点</small></button>
      <button class="rh-level" data-level="4">5<br><small>切分</small></button>
      <button class="rh-level" data-level="5">6<br><small>三连音</small></button>
    </div>

    <div class="set-label">练习长度（小节，4/4 拍）</div>
    <div class="measures-grid" id="measuresRow">
      <button class="rh-level active" data-measures="1">2<small>小节</small></button>
      <button class="rh-level" data-measures="2">4<small>小节</small></button>
      <button class="rh-level" data-measures="3">6<small>小节</small></button>
      <button class="rh-level" data-measures="4">8<small>小节</small></button>
    </div>

    <div class="bpm-row">
      <div class="bpm-label">速度 <b id="bpmValue">90</b> BPM</div>
      <div class="bpm-controls">
        <input type="range" id="bpmSlider" min="40" max="200" step="1" value="90">
        <input type="number" id="bpmInput" min="40" max="200" value="90" inputmode="numeric">
      </div>
      <div class="bpm-scale"><span>40</span><span>200</span></div>
    </div>

    <div class="opt-row">
      <label class="chk"><input type="checkbox" id="metOn" checked> 节拍器声音</label>
      <label class="chk"><input type="checkbox" id="subOn"> 细分节拍声（八分）</label>
    </div>

    <button id="startBtn" class="btn btn-primary">▶ 开始练习</button>
    <div class="set-tip">电脑：按<b>空格或任意键</b>敲击 · 手机：点下方大按钮。先听<b>四拍预备拍</b>，跟随拍点敲击，每敲一下实时判定「太早/准确/太晚」；长谱面可横向拖动。</div>
  </section>

  <!-- 练习 -->
  <section class="card hidden" id="playCard">
    <div class="quiz-top">
      <span id="rhLevelName">关卡 1 · 四分音符</span>
      <span id="rhBpm">BPM 90</span>
    </div>

    <div class="staff-wrap">
      <svg id="rhStaff" viewBox="0 0 580 200" role="img" aria-label="节奏谱"></svg>
    </div>

    <div class="rh-hint" id="rhHint">等待开始…</div>

    <button id="tapBtn" class="btn tap-btn">👆 敲击</button>

    <div class="rh-feedback" id="rhFeedback">&nbsp;</div>

    <div class="rh-stats-row">
      <span>准确 <b id="rhGood">0</b></span>
      <span>偏差 <b id="rhOff">0</b></span>
      <span>漏音 <b id="rhMiss">0</b></span>
      <span>多余 <b id="rhExtra">0</b></span>
    </div>

    <button id="stopBtn" class="btn btn-ghost">⏹ 停止</button>
  </section>

  <!-- 结果 -->
  <section class="card hidden" id="resultCard">
    <h2>练习完成 🎉</h2>
    <div class="stats">
      <div class="stat"><div class="stat-num" id="resRate">—</div><div class="stat-label">准确率</div></div>
      <div class="stat"><div class="stat-num" id="resAvg">—</div><div class="stat-label">平均偏差</div></div>
      <div class="stat"><div class="stat-num" id="resMiss">0</div><div class="stat-label">漏音</div></div>
      <div class="stat"><div class="stat-num" id="resExtra">0</div><div class="stat-label">多余敲击</div></div>
    </div>
    <div class="btn-row">
      <button id="againBtn" class="btn btn-primary">🔀 再来一轮</button>
      <button id="backBtn" class="btn btn-ghost">⚙ 返回设置</button>
    </div>
  </section>

</main>

<footer class="app-footer">
  节奏练习 · 可调 BPM · 内置节拍器 · 同站可切「调音器」「识谱」
</footer>

<script src="js/notation.js"></script>
<script src="js/rhythm.js"></script>
</body>
</html>
